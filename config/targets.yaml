# OPTION-ALERT 目标指标与评价规则（冻结 v1）
# 一 Setup 一 Primary Target（schema 硬约束）；RV/MFE/路径只作 secondary attribution。
schema_version: targets_v1
rule_freeze_date: "2026-08-22"
target_version: targets_v1

metrics:
  - id: 3D_close_return
    type: close_return
    horizon_days: 3
    data_required:
      - close
  - id: 5D_rv_expansion
    type: rv_ratio
    horizon_days: 5
    semantics: rv5d / rv20d_trailing 大于等于阈值
    data_required:
      - rv5d
      - rv20d
  - id: 5D_rv_contraction
    type: rv_ratio
    horizon_days: 5
    semantics: rv5d / rv20d_trailing 小于等于阈值
    data_required:
      - rv5d
      - rv20d
  - id: 3D_mdd
    type: mdd_path
    horizon_days: 3
    semantics: 窗口内从起点收盘的最大回撤幅度
    data_required:
      - close_path

evaluation_rules:
  close_to_close:
    start: event_date_close
    end: close_at_horizon
  rv_ratio:
    start: rv_at_horizon
    end: rv_at_horizon
  mdd_path:
    start: event_date_close
    end: path_min_max_drawdown

edge_composition:
  direction:
    trend: 0.4
    relative_strength: 0.3
    confirmation: 0.3
  volatility:
    iv_momentum: 0.5
    rv: 0.3
    term_structure: 0.2
  pricing:
    iv_minus_rv: 1.0

classification_thresholds:
  evidence:
    medium_min: 0.25
    high_min: 0.5
  pricing:
    cheap_below_pp: -3.0
    expensive_above_pp: 3.0

base_rate:
  levels:
    - unconditional
    - regime_adjusted
    - conditional_setup

pricing_proxy:
  iv_horizon: matching_expiry
  rv_horizon: matching_horizon
  minimum_history: 20
  percentile:
    cheap_lo: 20
    expensive_hi: 80
