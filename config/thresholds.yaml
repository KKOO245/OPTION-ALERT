# OPTION-ALERT 全局阈值（冻结 v1）
# 所有窗口/规则/权重/门槛在数据积累前预提交；事后不可放宽。
schema_version: thresholds_v1
rule_freeze_date: "2026-08-22"

oos_lift_min_pp: 5
ablation_incremental_min_pp: 5

ci:
  method: wilson
  level: 0.95

sample_gates:
  experimental_n: 10
  candidate_n: 10
  core_n: 20
  validated_n: 50
  established_n: 60
  regime_min_count_for_oos: 2

episode:
  clustering_rule: episode_v1
  max_gap_trading_days: 1
  representative_event: first
  outcome_anchor: episode_start

invalidated_ratio_alert: 0.30

data_sufficiency:
  rank_obs:
    preliminary: 20
    developing: 60
    established: 250
  setup_episodes:
    preliminary: 10
    developing: 30
    established: 60
  calibration_min_evaluated: 30
  conditional_distribution_min_episodes: 20
  move_surprise_min_occurrences: 10
  dynamic_trend_min_trading_days: 5

activity_magnitude:
  r1_pct:
    low: 5
    high: 20
  r2_pct:
    low: 5
    high: 20
  oi_abs:
    low: 50
    high: 500

forward_structure:
  version: forward_v1
  rule_freeze_date: "2026-08-24"
  n_expirations: 4            # 未来 4 个最近未到期结算日
  min_dte: 1                  # 排除当天 0 DTE（已过期）
  top_delta_oi_n: 3           # Top ΔOI 明细条数
  l3_max_distance_pct: 15.0   # L3 显著区：距现价 ≤ ±15%（经验默认，待校准；覆盖 575C+10.5% 类样本）

wall_quality_v1:
  version: wall_quality_v1
  rule_freeze_date: "2026-08-30"
  distance_cap_pct: 10.0      # 候选参数（待历史校准）：距现价超此值 → REMOTE（后台保留，不进主结构解读）
  dominance_min: 1.5          # 候选参数（待历史校准）：Wall OI / 次强非零 OI 的比值门槛
  strength_median_mult: 3.0   # 候选参数（待历史校准）：Wall OI ≥ 此倍数 × 非零行权价 OI 中位数 → HIGH
  note: "v1 默认值在 src/metrics.py WALL_QUALITY_V1；此处为正式登记与未来校准入口。分类：PRIMARY=距离内+Dominant+Strong；WEAK=距离内质量不足；REMOTE=距离外。"

event_differential:
  version: event_diff_v1
  min_diff_pp: 5.0            # 事件差分低于此值不提示（经验默认，待校准）
  control: adjacent           # 对照组 = 相邻下一期限（覆盖事件的期限 vs 不覆盖的相邻期限）

highlight:
  version: highlight_v1
  max_items: 3                # 每标的重点速览上限（全是重点 = 没有重点）
  ping_critical: true         # 仅 🔴 关键级触发角色提醒（角色 id 由部署环境配置）
  event_diff_critical_pp: 15.0  # 事件差分 ≥ 此值 → 关键
  event_diff_watch_pp: 10.0     # 事件差分 ≥ 此值 → 关注
  near_level_pct: 5.0           # Activity HIGH 且距现价 ≤ ±5% → 关注
  day_move_pct: 2.0             # 单日 |价格变动| ≥ 2% → 关注
  concentration_min_pct: 10.0   # Top ΔOI / 期限总 OI ≥ 10% → 信息
  roll_candidate_min_abs: 1000  # 疑似 roll 的最小 |ΔOI|（后台字段，不进报告/评分）

quality_gate:
  version: quality_gate_v1
  # Primary Flip 发布门槛：Flip 搜索带（±15%）内、OI 加权有效覆盖率 ≥ 此值（v1 候选值，待校准）
  effective_coverage_pct: 80.0
  flip_search_band_pct: 15.0

p3_collect:
  version: p3_collect_v1
  ivrv_rv_window: 20          # IV/RV 用最近 N 个交易日收盘计算 realized vol
  ivrv_min_obs: 5             # 少于 N 个收盘价 → RV 为 None（不编造）
  vanna_gate_vol_pp: 0.5      # vanna 门控：|IV 变动| ≥ 0.5 vol pts（经验默认，待校准）
  charm_gate_max_dte: 5       # charm 门控：最近期限 DTE ≤ 5
  confluence_band_pct: 2.0    # Confluence：±2% 价格带内聚合同族
  event_overlap_include_past: false  # 事件覆盖仅统计未来（>= 今日）事件

comparison_change:
  price_pct: 0.5
  iv_pp: 0.5
  pc_vol: 0.2
  gex:
    rel_pct: 20
    abs: 1000000
