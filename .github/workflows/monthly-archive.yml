name: 月度数据归档

on:
  schedule:
    # 每月 1 日 01:30 UTC = 多伦多前一日 20:30/21:30 左右。
    # 这样每月第一个工作日晚报提醒"下载归档"时，归档已经上传完毕。
    - cron: "30 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 计算上个月份
        run: |
          PREV=$(date -u -d "last month" +%Y-%m)
          echo "PREV_MONTH=$PREV" >> "$GITHUB_ENV"
          echo "归档月份: $PREV"

      - name: 打包上个月每日快照
        run: |
          mkdir -p archive
          if ls -d "analytics/daily/${PREV_MONTH}-"* >/dev/null 2>&1; then
            zip -qr "archive/data-${PREV_MONTH}.zip" "analytics/daily/${PREV_MONTH}-"*
            echo "HAS_DATA=true" >> "$GITHUB_ENV"
            echo "已打包 data-${PREV_MONTH}.zip"
          else
            echo "HAS_DATA=false" >> "$GITHUB_ENV"
            echo "该月没有快照目录，跳过"
          fi

      - name: 上传 Releases 归档
        id: release
        if: env.HAS_DATA == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-${{ env.PREV_MONTH }}
          name: 数据归档 ${{ env.PREV_MONTH }}
          files: archive/data-${{ env.PREV_MONTH }}.zip
          fail_on_unmatched_files: true

      - name: 清理已归档的旧每日快照（保留最近 3 个月；release 上传成功后才执行）
        if: steps.release.outputs.url != '' && env.HAS_DATA == 'true'
        run: |
          CUTOFF=$(date -u -d "3 months ago" +%Y-%m)
          echo "保留 >= ${CUTOFF}，删除更早的 analytics/daily 目录"
          for d in analytics/daily/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            if [[ "$name" < "$CUTOFF" ]]; then
              echo "删除已归档目录: $d"
              rm -rf "$d"
            fi
          done
          git config user.name "options-report-bot"
          git config user.email "options-report-bot@users.noreply.github.com"
          git add analytics/daily
          git diff --cached --quiet || git commit -m "清理已归档快照 $(date -u +'%Y-%m-%d')"
          git push

      # 安全边界：只清理 analytics/daily；thesis/episodes/state 永不裁剪。
      # 本地镜像会同步删除（git pull），因此每月提醒"下载 Releases 归档"不可跳过。
