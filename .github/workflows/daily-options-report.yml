name: 每日期权报告

on:
  schedule:
    # re-register-schedule: 2026-08-28 —— 触发 GitHub 重新注册定时任务（治理 schedule 静默失效）
    # 说明：GitHub Actions对"间隔短于1小时"的定时任务经常会静默丢弃大部分触发
    # (不报错、不提示，就是不执行)，这是GitHub官方文档承认的已知限制。
    # 实测发现：即使是整点触发，早上那几次尝试也可能被大幅延迟(观察到延迟
    # 超过60分钟的情况)，所以这里改成"从UTC 11点到23点，每小时连续触发"，
    # 不再分早晚两段留空档，给10:30和16:30两个目标时间各自留出更多次
    # 独立的备份尝试机会。脚本内部按多伦多 10:15/16:30 判断是否真正发送。
    - cron: "0 11-23 * * 1-5"
  workflow_dispatch:      # 允许你在GitHub网页上手动点击"Run workflow"立即测试
    inputs:
      force_send:
        description: "强制发送(忽略时间检查，用于手动测试，不影响自动定时运行)"
        type: boolean
        default: true
      session:
        description: "指定发送会话（需配合 force_send=true 用于手动补发；auto 走正常时间窗口）"
        type: choice
        default: auto
        options:
          - auto
          - morning
          - evening
          - both
      use_new_renderer:
        description: "使用 P0.3 新格式报告（false 则退回旧格式）"
        type: boolean
        default: true

env:
  USE_NEW_RENDERER: ${{ github.event.inputs.use_new_renderer == 'false' && 'false' || 'true' }}

permissions:
  contents: write   # 需要写权限，用来把每天的数据快照存回仓库(供下次对比异动)

# 防止GitHub偶尔"攒了几次没跑、集中补跑"时，两次运行几乎同时执行导致重复发送：
# 强制同一个workflow的多次触发排队依次执行，不允许并行。
concurrency:
  group: daily-options-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      # 关键省钱步骤：非目标时段直接结束，
      # 不装依赖、不跑脚本，每次空跑只花约半分钟而不是1-2分钟
      - name: 快速时间检查（非目标时段直接结束）
        id: timecheck
        env:
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: |
          python3 - <<'PY'
          import datetime, os
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("America/Toronto"))
          force = os.environ.get("FORCE_SEND", "false").lower() == "true"
          run = force
          if not run:
              cur = now.hour * 60 + now.minute
              # 单向窗口：只准迟到、不许早到（绝不提前发报告）
              # 早报目标 10:15，容差 135 分钟（到 12:30）；晚报目标 16:30，容差 180 分钟（到 19:30）
              # 使 11:00/12:00 与 17:00/18:00/19:00 整点槽都能兜底，降低 GitHub cron 漏触发风险
              run = any(
                  0 <= cur - (h * 60 + m) <= tol
                  for (h, m), tol in (((10, 15), 135), ((16, 30), 180))
              )
          print(f"多伦多时间 {now:%Y-%m-%d %H:%M}，需要运行={run}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"run_needed={'true' if run else 'false'}\n")
          PY

      - name: 设置Python环境
        if: steps.timecheck.outputs.run_needed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"   # 缓存依赖包，加快"跳过型"运行的速度，省Actions分钟数

      - name: 安装依赖
        if: steps.timecheck.outputs.run_needed == 'true'
        run: pip install -r requirements.txt

      - name: 运行期权报告脚本(非目标时段/今天已发送过会自动跳过，不发送)
        if: steps.timecheck.outputs.run_needed == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          LLM_ENABLED: ${{ vars.LLM_ENABLED }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
          FORCE_SESSION: ${{ github.event.inputs.session }}
          # 新格式启用时旧脚本只抓数据/存快照/标记已发送，不发旧格式
          REPORT_DRY_RUN: ${{ env.USE_NEW_RENDERER }}
        run: python src/options_report.py

      - name: 事件引擎（检测/聚类/结果回填）
        if: steps.timecheck.outputs.run_needed == 'true'
        run: |
          set +e
          python main.py detect --all
          rc_detect=$?
          python main.py episodes
          rc_episodes=$?
          python main.py evaluate
          rc_evaluate=$?
          echo "detect=$rc_detect episodes=$rc_episodes evaluate=$rc_evaluate"
          exit $((rc_detect + rc_episodes + rc_evaluate))

      - name: 渲染新格式晨/晚报（P0.3，写入 data/reports 供人工复核）
        if: always() && steps.timecheck.outputs.run_needed == 'true'
        run: |
          DATE=$(python3 - <<'PY'
          import datetime
          from zoneinfo import ZoneInfo
          print(datetime.datetime.now(ZoneInfo("America/Toronto")).date().isoformat())
          PY
          )
          mkdir -p data/reports
          while read -r T; do
            python main.py render-morning --ticker "$T" --date "$DATE" --out "data/reports/${DATE}_morning_${T}.md" || true
            python main.py render-evening --ticker "$T" --date "$DATE" --out "data/reports/${DATE}_evening_${T}.md" || true
          done < <(grep -vE '^\s*(#|$)' config/tickers.txt)

      - name: 发送新格式晨/晚报到 Discord（P0.3）
        if: always() && steps.timecheck.outputs.run_needed == 'true' && env.USE_NEW_RENDERER == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FORCE: ${{ github.event.inputs.force_send }}
          SESSION_INPUT: ${{ github.event.inputs.session }}
        run: |
          SESSIONS=$(python3 - <<'PY'
          import datetime, os
          from zoneinfo import ZoneInfo
          now = datetime.datetime.now(ZoneInfo("America/Toronto"))
          sess_input = os.environ.get("SESSION_INPUT", "auto")
          if sess_input == "morning":
              print("morning")
          elif sess_input == "evening":
              print("evening")
          elif sess_input == "both":
              print("morning evening")
          elif os.environ.get("FORCE", "") == "true":
              print("morning evening")
          else:
              cur = now.hour * 60 + now.minute
              if 10 * 60 + 15 <= cur <= 12 * 60 + 30:
                  print("morning")
              elif 16 * 60 + 30 <= cur <= 19 * 60 + 30:
                  print("evening")
              else:
                  print("skip")
          PY
          )
          if [ "$SESSIONS" = "skip" ]; then
            echo "非发送窗口，跳过"
            exit 0
          fi
          echo "本次发送会话: [$SESSIONS]"
          DATE=$(python3 - <<'PY'
          import datetime
          from zoneinfo import ZoneInfo
          print(datetime.datetime.now(ZoneInfo("America/Toronto")).date().isoformat())
          PY
          )
          echo "== 验证 webhook =="
          python main.py send-report-all --session evening --date "$DATE" \
            --webhook-url "$DISCORD_WEBHOOK_URL" --verify || exit 1
          FAILED=0
          for S in $SESSIONS; do
            python main.py send-report-all --session "$S" --date "$DATE" \
              --webhook-url "$DISCORD_WEBHOOK_URL" || { echo "[发送失败] $S"; FAILED=1; }
            sleep 1  # Discord webhook 限速 30 条/分钟，防 429
          done
          [ "$FAILED" = "0" ] || exit 1
          echo "发送步骤完成"

      - name: 保存数据快照/事件/发送记录(没有实际变化时这一步不会产生新提交)
        # always(): 即使事件引擎某一步失败，也先把当天已抓取的数据提交，避免丢失
        if: always() && steps.timecheck.outputs.run_needed == 'true'
        run: |
          git config user.name "options-report-bot"
          git config user.email "options-report-bot@users.noreply.github.com"
          git add data/history data/analytics data/reports data/iv_history data/closes analytics state thesis episodes
          git diff --cached --quiet || git commit -m "更新期权数据快照 $(date -u +'%Y-%m-%d %H:%M')"
          git push
