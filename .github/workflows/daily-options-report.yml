name: 每日期权报告

on:
  schedule:
    # 说明：多伦多时间10:30和16:30，会因夏令时(EDT, UTC-4)/冬令时(EST, UTC-5)
    # 而对应不同的UTC时间。这里同时设置两种可能的UTC时间点(共4个)，
    # 具体是否真正发送邮件，由脚本内部检测当前多伦多本地时间来决定——
    # 不是目标时段就会自动跳过、不发邮件，所以全年不需要手动改这个文件。
    #
    # UTC 14:30 -> 多伦多 10:30 (夏令时 EDT，约3月-11月)
    # UTC 15:30 -> 多伦多 10:30 (冬令时 EST，约11月-3月)
    # UTC 20:30 -> 多伦多 16:30 (夏令时 EDT)
    # UTC 21:30 -> 多伦多 16:30 (冬令时 EST)
    - cron: "30 14 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:      # 允许你在GitHub网页上手动点击"Run workflow"立即测试
    inputs:
      force_send:
        description: "强制发送(忽略时间检查，用于手动测试，不影响自动定时运行)"
        type: boolean
        default: true

permissions:
  contents: write   # 需要写权限，用来把每天的数据快照存回仓库(供下次对比异动)

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行期权报告脚本(非目标时段会自动跳过，不发邮件)
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: python src/options_report.py

      - name: 保存今天的数据快照(仅"午报"时段会真正写入)
        run: |
          git config user.name "options-report-bot"
          git config user.email "options-report-bot@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || git commit -m "更新期权数据快照 $(date -u +'%Y-%m-%d')"
          git push
