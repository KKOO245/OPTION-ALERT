name: 每日期权报告

on:
  schedule:
    # 说明：GitHub Actions对"间隔短于1小时"的定时任务经常会静默丢弃大部分触发
    # (不报错、不提示，就是不执行)，这是GitHub官方文档承认的已知限制。
    # 所以这里改成"整点触发、间隔1小时"(符合GitHub建议的可靠频率)，
    # 在10:30和16:30这两个目标时间前后各安排几次独立的整点尝试作为备份，
    # 只要其中任何一次真的被GitHub执行了，就能在容差范围内命中目标时段发出邮件。
    # UTC 12-16点整点(5次) 覆盖 多伦多10:30目标(EDT/EST下都有2-3次落在容差内)
    # UTC 18-22点整点(5次) 覆盖 多伦多16:30目标(EDT/EST下都有2-3次落在容差内)
    - cron: "0 12-16,18-22 * * 1-5"
  workflow_dispatch:      # 允许你在GitHub网页上手动点击"Run workflow"立即测试
    inputs:
      force_send:
        description: "强制发送(忽略时间检查，用于手动测试，不影响自动定时运行)"
        type: boolean
        default: true

permissions:
  contents: write   # 需要写权限，用来把每天的数据快照存回仓库(供下次对比异动)

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"   # 缓存依赖包，加快"跳过型"运行的速度，省Actions分钟数

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行期权报告脚本(非目标时段/今天已发送过会自动跳过，不发邮件)
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: python src/options_report.py

      - name: 保存数据快照/发送记录(没有实际变化时这一步不会产生新提交)
        run: |
          git config user.name "options-report-bot"
          git config user.email "options-report-bot@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || git commit -m "更新期权数据快照 $(date -u +'%Y-%m-%d %H:%M')"
          git push
