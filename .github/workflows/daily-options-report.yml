name: 每日期权报告

on:
  schedule:
    # 每15分钟检查一次，只在 UTC 12:00-23:45 这个窗口内(覆盖多伦多时间
    # 大约早7点到晚8点，不管夏令时/冬令时，10:30和16:30这两个目标时间点
    # 前后都留了2.5-3.5小时的缓冲，用来应对GitHub免费额度定时任务可能出现
    # 的延迟)。具体是否真正发邮件，由脚本内部检测当前多伦多本地时间来决定，
    # 命中10:30或16:30附近才会真的发送，其余检查几十秒内就直接结束，
    # 不会真的抓数据/发邮件，所以不会浪费太多免费的Actions分钟数。
    - cron: "*/15 12-23 * * 1-5"
  workflow_dispatch:      # 允许你在GitHub网页上手动点击"Run workflow"立即测试
    inputs:
      force_send:
        description: "强制发送(忽略时间检查，用于手动测试，不影响自动定时运行)"
        type: boolean
        default: true

permissions:
  contents: write   # 需要写权限，用来把每天的数据快照存回仓库(供下次对比异动)

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"   # 缓存依赖包，加快"跳过型"运行的速度，省Actions分钟数

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行期权报告脚本(非目标时段/今天已发送过会自动跳过，不发邮件)
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          FORCE_SEND: ${{ github.event.inputs.force_send }}
        run: python src/options_report.py

      - name: 保存数据快照/发送记录(没有实际变化时这一步不会产生新提交)
        run: |
          git config user.name "options-report-bot"
          git config user.email "options-report-bot@users.noreply.github.com"
          git add data/history
          git diff --cached --quiet || git commit -m "更新期权数据快照 $(date -u +'%Y-%m-%d %H:%M')"
          git push
